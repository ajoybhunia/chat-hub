# Classpath shadow of application.yml for tests: no DATABASE_URL / JWT_SECRET
# required — the datasource URL is supplied by @ServiceConnection (Testcontainers)
# at runtime and the JWT secret is a test-only value.
spring:
  application:
    name: chat-hub-test
  datasource:
    url: jdbc:postgresql://localhost:5432/overridden-by-serviceconnection

app:
  jwt-secret: test-only-jwt-secret-0123456789abcdefghijklmnop
  # Mirrors main config so origin-handshake tests exercise the real patterns.
  websocket-allowed-origin-patterns:
    - http://localhost:*
    - http://127.0.0.1:*

# Quiet test output — WARN and above only (pairs with logback-test.xml).
logging:
  level:
    root: warn

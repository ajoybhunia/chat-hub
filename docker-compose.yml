version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatdb
    ports:
      # 5433: host 5432 is occupied by the local Homebrew PostgreSQL
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Runs natively, not containerized:
  #   backend:  cd backend && ./gradlew bootRun   (port 8000)
  #   frontend: cd frontend && npm run dev        (port 5173)
  # The frontend container embeds the BFF (Vite plugin): the browser only
  # talks to 5173; UPSTREAM_URL is where the BFF forwards /api + /socket.
  frontend:
    build: ./frontend
    command: npm run dev -- --host
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep image's linux modules over the host mount
    environment:
      UPSTREAM_URL: http://host.docker.internal:8000
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Linux compatibility
    ports:
      - '5173:5173'

volumes:
  pgdata:

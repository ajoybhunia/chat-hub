version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatdb
    ports:
      # 5433: host 5432 is occupied by the local Homebrew PostgreSQL
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Runs natively, not containerized:
  #   backend:  cd backend && ./gradlew bootRun   (port 8000)
  #   frontend: cd frontend && npm run dev             (port 5173)
  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - '5173:5173'

volumes:
  pgdata:
